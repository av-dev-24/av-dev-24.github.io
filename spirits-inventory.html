<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stillroom — Spirits Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15100b;
    --surface: #1e1710;
    --surface-2: #251c13;
    --line: #3a2e20;
    --line-soft: #2c2216;
    --ink: #f3e9d8;
    --ink-dim: #cdbfa8;
    --ink-muted: #a1917a;
    --copper: #c1813f;
    --copper-strong: #e0985a;
    --copper-wash: rgba(193,129,63,0.14);
    --juniper: #7c8f61;
    --juniper-wash: rgba(124,143,97,0.16);
    --danger: #c1573a;
    --danger-wash: rgba(193,87,58,0.16);
    --radius-s: 7px;
    --radius-m: 14px;
    --radius-l: 22px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Manrope', sans-serif;
    --dur: 160ms;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height:1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ font-family: var(--font-display); font-weight:600; margin:0; }
  p{ margin:0; }
  button{ font-family: inherit; color: inherit; }
  input{ font-family: inherit; color: inherit; }
  ul{ list-style:none; margin:0; padding:0; }

  ::selection{ background: var(--copper-wash); color: var(--ink); }

  *:focus{ outline:none; }
  *:focus-visible{ outline: 2px solid var(--copper-strong); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  /* ---------- Layout shell ---------- */
  .app{
    display:flex;
    min-height:100vh;
  }

  /* Itago ang mobile menu button sa desktop */
  .mobile-menu-btn {
    display: none !important; 
  }

  .rail {
    width: 68px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: flex-start; /* Binago mula center */
    padding: 18px 14px; /* Binago para sa consistent left alignment */
    gap: 26px;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 20;
    transition: width 280ms cubic-bezier(0.4, 0, 0.2, 1);
    overflow-x: hidden; /* Itatago ang text habang nag-eexpand */
  }
  .rail.is-expanded {
    width: 200px;
  }

  /* Header Section */
  .rail-header {
    display: flex; align-items: center; gap: 12px; padding-left: 2px;
  }
  .rail-mark {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(155deg, var(--copper-strong), var(--copper) 65%, #8f5c2b);
    display: flex; align-items: center; justify-content: center;
    color: #1a1006; font-family: var(--font-display); font-weight: 700; font-size: 16px;
  }
  .rail-brand {
    font-family: var(--font-display); font-size: 17px; font-weight: 700;
    color: var(--ink); white-space: nowrap; opacity: 0;
    transition: opacity 200ms ease;
  }
  .rail.is-expanded .rail-brand {
    opacity: 1; transition-delay: 140ms; /* Pababagalin ng konti ang fade in */
  }

  /* Navigation Buttons */
  .rail-nav { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .rail-btn {
    width: 40px; height: 40px;
    border: none; background: transparent; border-radius: var(--radius-s);
    display: flex; align-items: center; justify-content: flex-start;
    padding: 0 10px; /* Saktong space para pumagitna ang 19px icon sa 40px box */
    gap: 14px; color: var(--ink-muted); cursor: pointer;
    transition: width 280ms ease, background var(--dur), color var(--dur);
    white-space: nowrap; overflow: hidden;
  }
  .rail.is-expanded .rail-btn { width: 100%; } /* Lalapad ang clickable area */
  .rail-btn:hover { background: var(--surface-2); color: var(--ink-dim); }
  .rail-btn.is-active { background: var(--copper-wash); color: var(--copper-strong); }
  .rail-btn svg { width: 19px; height: 19px; flex-shrink: 0; }
  
  .rail-label {
    opacity: 0; font-size: 13.5px; font-weight: 600;
    transition: opacity 200ms ease;
  }
  .rail.is-expanded .rail-label {
    opacity: 1; transition-delay: 140ms;
  }

  .rail-spacer { flex: 1; }

  /* Bottom Section */
  .rail-bottom { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .rail-avatar-wrap { display: flex; align-items: center; gap: 14px; padding-left: 3px; }
  .rail-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--juniper); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: #12160d;
  }

  /* Animated Arrow Icon */
  .rail-toggle-icon { transition: transform 300ms ease; }
  .rail.is-expanded .rail-toggle-icon { transform: rotate(180deg); }

  .content {
    flex: 1;
    display: grid;
    grid-template-columns: 258px 1fr; /* Dalawang column na lang */
    grid-template-rows: auto 1fr;
    height: 100vh;
    min-width: 0;
  }

  /* ---------- Sidebar (filters) ---------- */
  .sidebar {
    grid-column: 1;
    grid-row: 2;
    border-right: 1px solid var(--line);
    padding: 22px 18px 40px;
    overflow-y: auto;
    height: 100%;
  }
  .filter-group{
    border-bottom:1px solid var(--line-soft);
    padding: 15px 0;
  }
  .filter-group:first-child{ padding-top:0; }
  .filter-group-head{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; background:none; border:none; cursor:pointer;
    padding:0; text-align:left;
  }
  .filter-group-head h3{
    font-family: var(--font-body);
    font-weight:700;
    font-size:13px;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .chev{
    width:16px; height:16px; color: var(--ink-muted);
    transition: transform var(--dur);
    flex-shrink:0;
  }
  .filter-group.is-collapsed .chev{ transform: rotate(-90deg); }
  .filter-group.is-collapsed .filter-group-body{ display:none; }
  .filter-group-body{ margin-top:12px; display:flex; flex-direction:column; gap:9px; }

  .check-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; cursor:pointer;
  }
  .check-row-left{ display:flex; align-items:center; gap:9px; }
  .check-row input[type="checkbox"]{
    appearance:none; -webkit-appearance:none;
    width:16px; height:16px; border-radius:4px;
    border:1.5px solid var(--ink-muted);
    background: transparent;
    cursor:pointer;
    display:grid; place-content:center;
    flex-shrink:0;
  }
  .check-row input[type="checkbox"]::after{
    content:"";
    width:9px; height:9px;
    border-radius:2px;
    background: var(--copper-strong);
    transform: scale(0);
    transition: transform 120ms;
  }
  .check-row input[type="checkbox"]:checked{ border-color: var(--copper-strong); }
  .check-row input[type="checkbox"]:checked::after{ transform: scale(1); }
  .check-row label{ font-size:13px; color: var(--ink-dim); cursor:pointer; }
  .check-row .count{ font-size:12px; color: var(--ink-muted); }

  .price-inputs{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .price-field{ flex:1; }
  .price-field span{ display:block; font-size:11px; color: var(--ink-muted); margin-bottom:4px; }
  .price-field input{
    width:100%; background: var(--surface-2); border:1px solid var(--line);
    border-radius: var(--radius-s); padding:7px 9px; color: var(--ink);
    font-size:13px;
  }
  .price-field input:focus-visible{ border-color: var(--copper-strong); }
  .price-sep{ color: var(--ink-muted); margin-top:14px; }
  .range-track{
    position:relative; height:4px; background: var(--surface-2);
    border-radius:4px; margin-top:6px;
  }
  .range-track-fill{
    position:absolute; top:0; left:0; height:100%;
    background: var(--copper-strong); border-radius:4px;
  }
  .range-input{
    position:absolute; top:-8px; left:0; width:100%;
    -webkit-appearance:none; appearance:none;
    background:transparent; margin:0; height:20px;
    pointer-events:none;
  }
  .range-input::-webkit-slider-thumb{
    -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background: var(--copper-strong); border:2px solid #1a1006; cursor:pointer; margin-top:0;
    pointer-events:auto;
  }
  .range-input::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background: var(--copper-strong); border:2px solid #1a1006; cursor:pointer;
    pointer-events:auto;
  }
  .range-input::-webkit-slider-runnable-track{ background:transparent; }

  .swatch-row{ display:flex; flex-wrap:wrap; gap:9px; }
  .swatch{
    width:24px; height:24px; border-radius:50%;
    border:2px solid transparent; cursor:pointer;
    position:relative;
  }
  .swatch.is-active{ border-color: var(--copper-strong); }
  .swatch.is-active::after{
    content:"✓"; position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center; font-size:11px; color:#12160d;
  }

  .clear-filters{
    background:none; border:none; color: var(--copper-strong);
    font-size:13px; font-weight:600; cursor:pointer; padding: 16px 0 0;
  }
  .clear-filters:hover{ text-decoration: underline; }

  /* ---------- Main ---------- */
  .main { 
    grid-column: 2;
    grid-row: 2;
    padding: 26px 30px 40px; 
    overflow-y: auto; 
    height: 100%;
    min-width: 0; 
  }

  .main-header {
    grid-column: 1 / 3;
    grid-row: 1;
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    padding: 26px 30px 18px 18px; /* Nilagyan ng left padding para pumantay sa sidebar */
    margin-bottom: 0;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    z-index: 10;
  }
  .main-header h1{ font-size:26px; color: var(--ink); }
  .main-header .sub{ color: var(--ink-muted); margin-top:6px; font-size:13.5px; max-width:46ch; }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .date-pill{
    display:flex; align-items:center; gap:8px;
    background: var(--surface); border:1px solid var(--line);
    padding:8px 13px; border-radius: 999px; font-size:13px; color: var(--ink-dim);
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line); background: var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color: var(--ink-dim);
    transition: transform var(--dur), background var(--dur);
  }
  .icon-btn:hover{ background: var(--surface-2); }
  .icon-btn.is-spinning svg{ animation: spin 620ms ease; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .icon-btn svg{ width:16px; height:16px; }

  .toolbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .tabs{
    display:flex; background: var(--surface); border:1px solid var(--line);
    border-radius: 999px; padding:3px; gap:2px;
    margin-right: auto;
  }
  .tab-btn{
    border:none; background:transparent; padding:8px 16px; border-radius:999px;
    font-size:13px; font-weight:600; color: var(--ink-muted); cursor:pointer;
    transition: background var(--dur), color var(--dur);
    white-space:nowrap;
  }
  .tab-btn.is-active{ background: var(--copper); color:#1a1006; }

.search-wrap {
  flex: 1; 
  min-width: 160px; 
  max-width: 620px; 
  position: relative;
}

.search-wrap svg {
  position: absolute; 
  left: 22px;
  top: 50%; 
  transform: translateY(-50%);
  width: 24px; /* Pinaliit nang konti mula 24px */
  height: 24px; 
  color: var(--ink-muted);
}

.search-wrap input {
  width: 100%; 
  background: var(--surface); 
  border: 1px solid var(--line); 
  border-radius: 999px; 
  padding:14px 22px 14px 54px; 
  font-size: 15px; 
  color: var(--ink);
  outline: none; 
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.search-wrap input::placeholder { 
  color: var(--ink-muted); 
}

.search-wrap input:focus-visible { 
  border-color: var(--copper-strong); 
}

  .filter-toggle-btn { 
    display: flex; 
  }

  .btn-primary{
    background: var(--copper); color:#1a1006; border:none;
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700;
    display:flex; align-items:center; gap:8px; cursor:pointer;
    transition: background var(--dur);
    white-space:nowrap;
  }
  .btn-primary:hover{ background: var(--copper-strong); }
  .btn-primary svg{ width:15px; height:15px; }

  .grid-meta{ color: var(--ink-muted); font-size:12.5px; margin-bottom:12px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap:16px;
    margin-bottom:20px;
  }

  .product-card-wrap{ position:relative; height:100%; }
  .product-card{
    width:100%; height:100%;
    text-align:left; background: var(--surface); border:1px solid var(--line);
    border-radius: var(--radius-m); padding:14px; cursor:pointer;
    position:relative; display:flex; flex-direction:column; gap:10px;
    transition: border-color var(--dur), transform var(--dur);
  }
  .product-card:hover{ border-color:#5a4630; transform: translateY(-2px); }
  .product-card.is-active{ border-color: var(--copper-strong); background: var(--surface-2); }

  .badge{
    position:absolute; top:12px; left:12px; z-index:2;
    font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px;
    background: var(--surface-2); color: var(--ink-dim); border:1px solid var(--line);
  }
  .badge-bestseller{ background: var(--copper-wash); color: var(--copper-strong); border-color: transparent; }
  .badge-new{ background: var(--juniper-wash); color: var(--juniper); border-color: transparent; }
  .badge-limited{ background: var(--danger-wash); color: #dd8a76; border-color: transparent; }

  .card-menu{
    position:absolute; top:10px; right:8px; z-index:2;
    width:26px; height:26px; border-radius:50%; border:none; background:transparent;
    color: var(--ink-muted); cursor:pointer; font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .card-menu:hover{ background: var(--surface-2); color: var(--ink-dim); }

  .card-art{
    height:128px; display:flex; align-items:center; justify-content:center;
    background: var(--surface-2); border-radius: var(--radius-s);
  }
  .card-art svg{ height:96%; width:auto; }

  .card-name{ font-weight:600; color: var(--ink); font-size:13.5px; line-height:1.35; }
  .card-meta{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-price{ font-family: var(--font-display); font-weight:600; font-size:15px; color: var(--ink); }

  .pill{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  .pill-in{ background: var(--juniper-wash); color: var(--juniper); }
  .pill-low{ background: var(--copper-wash); color: var(--copper-strong); }
  .pill-out{ background: var(--danger-wash); color:#dd8a76; }

  .empty-state{
    grid-column: 1/-1;
    text-align:center; padding:60px 20px; color: var(--ink-muted);
    border:1px dashed var(--line); border-radius: var(--radius-m);
  }
  .empty-state h3{ color: var(--ink-dim); font-size:16px; margin-bottom:8px; }
  .empty-state button{
    margin-top:14px; background:none; border:1px solid var(--line);
    color: var(--copper-strong); padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600;
  }

  .pagination{ display:flex; align-items:center; gap:6px; justify-content:flex-start; flex-wrap:wrap; }
  .page-btn{
    min-width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background: var(--surface); color: var(--ink-dim); cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center; padding:0 6px;
  }
  .page-btn:hover:not(:disabled){ background: var(--surface-2); }
  .page-btn.is-active{ background: var(--copper); border-color: var(--copper); color:#1a1006; font-weight:700; }
  .page-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .page-btn svg{ width:14px; height:14px; }

  /* ---------- Detail panel ---------- */
  .modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -45%) scale(0.95);
    width: 90%;
    max-width: 660px;
    max-height: 85vh; /* Hanggang 85% lang ng screen height */
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-l);
    z-index: 60;
    opacity: 0;
    visibility: hidden;
    transition: transform 200ms ease, opacity 200ms ease, visibility 200ms;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 24px 48px rgba(0,0,0,0.5);
  }
  .modal.is-open {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
  }
  .modal-content {
    padding: 26px 22px 30px;
    overflow-y: auto; /* Dito mag-ss-scroll kung mahaba ang detail */
    height: 100%;
  }

  /* 4. SIGURADUHING PALAGING KITA ANG CLOSE BUTTON SA MODAL */
  .detail-close { display: flex !important; }

  .detail {
    grid-column: 3;
    grid-row: 1 / 3; /* Sasakop hanggang taas */
    border-left: 1px solid var(--line);
    padding: 26px 22px 40px;
    overflow-y: auto; 
    height: 100%;
  }
  .detail-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .detail-head h2{ font-size:15px; }
  .detail-close{ display:none; }

  .detail-hero{
    background: var(--surface); border:1px solid var(--line);
    border-radius: var(--radius-l); padding:20px; margin-bottom:16px;
  }
  .detail-hero-top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
  .detail-hero-top h3{ font-size:16px; }
  .detail-art{ display:flex; align-items:center; justify-content:center; height:190px; margin:8px 0 14px; }
  .detail-art svg{ height:100%; width:auto; }
  .detail-price{ font-family: var(--font-display); font-size:20px; font-weight:600; color: var(--copper-strong); margin-top:4px; }

  .stat-row{
    display:flex; align-items:center; gap:18px; margin-top:16px; padding-top:16px;
    border-top:1px solid var(--line-soft);
  }
  .stat{ display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  .stat svg{ width:15px; height:15px; color: var(--ink-muted); }
  .stat b{ font-size:13px; color: var(--ink); }
  .stat span{ font-size:11px; color: var(--ink-muted); }

  .accordion-item{ border-bottom:1px solid var(--line-soft); }
  .accordion-item:first-child{ border-top:1px solid var(--line-soft); }
  .accordion-head{
    width:100%; background:none; border:none; padding:14px 2px;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer; text-align:left; gap:10px;
  }
  .accordion-head-left{ display:flex; align-items:center; gap:11px; }
  .accordion-head-left svg{ width:16px; height:16px; color: var(--ink-muted); flex-shrink:0; }
  .accordion-head b{ font-size:13px; color: var(--ink); display:block; }
  .accordion-head p{ font-size:11.5px; color: var(--ink-muted); margin-top:2px; }
  .accordion-item .chev{ transition: transform var(--dur); }
  .accordion-item.is-open .chev{ transform: rotate(180deg); }
  .accordion-body{ display:none; padding: 0 2px 16px 43px; }
  .accordion-item.is-open .accordion-body{ display:block; }
  .accordion-body p{ font-size:13px; color: var(--ink-dim); line-height:1.6; margin-bottom:8px; }
  .accordion-body dl{ display:grid; grid-template-columns: auto 1fr; gap:6px 14px; margin:0; }
  .accordion-body dt{ font-size:12px; color: var(--ink-muted); }
  .accordion-body dd{ font-size:12.5px; color: var(--ink-dim); margin:0; }

  .save-btn{
    width:100%; margin-top:18px; background: var(--copper); color:#1a1006;
    border:none; padding:13px; border-radius: 999px; font-weight:700; font-size:13.5px;
    cursor:pointer; transition: background var(--dur);
  }
  .save-btn:hover{ background: var(--copper-strong); }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(140%);
    background: var(--surface-2); border:1px solid var(--line); color: var(--ink);
    padding:12px 20px; border-radius:999px; font-size:13px; z-index:100;
    transition: transform 220ms ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .toast.is-visible{ transform:translateX(-50%) translateY(0); }

  .backdrop {
    display: none; position: fixed; inset: 0; background: rgba(10,7,4,0.7); z-index: 40;
  }
  .backdrop.is-visible{ display:block; }

/* ---------- BAGO: LIST VIEW STYLES ---------- */
  .grid.is-list-view {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .grid.is-list-view .product-card-wrap {
    height: auto;
  }

    gap: 16px;
    height: auto;
  }

    order: 1;
    height: 52px; width: 52px;
    flex-shrink: 0; margin: 0;
  }
  .grid.is-list-view .card-name {
    order: 2;
    flex-grow: 1;
    font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .grid.is-list-view .badge {
    order: 3;
    position: static; /* Tatanggalin sa absolute position */
    flex-shrink: 0;
    margin-left: auto;
  }
  .grid.is-list-view .card-meta {
    order: 4;
    flex-shrink: 0; gap: 20px;
  }
  .grid.is-list-view .card-menu {
    top: 50%;
    transform: translateY(-50%);
    right: 12px;
  }

  /* ---------- Responsive ---------- */
  /* 2. BAGONG BLOCK: Para lang ito sa Desktop view (mas malaki sa 860px) */
  /* BAGONG BLOCK: Para lang ito sa Desktop view (mas malaki sa 860px) */
  @media (min-width: 861px) {
    /* Kapag naka-collapse ang sidebar, magiging isang column na lang ang content */
    .content.sidebar-collapsed {
      grid-template-columns: 1fr;
    }
    
    /* Itatago natin ng tuluyan ang sidebar */
    .content.sidebar-collapsed .sidebar {
      display: none;
    }
    
    /* FIX: I-adjust ang header para pumunta sa column 1 at ayusin ang padding */
    .content.sidebar-collapsed .main-header {
      grid-column: 1; 
      padding-left: 30px;
    }
    
    /* FIX: Ilipat din ang main content sa column 1 para sakupin nito ang buong lapad! */
    .content.sidebar-collapsed .main {
      grid-column: 1;
    }
  }

  @media (max-width: 1180px){
    .content{ grid-template-columns: 240px 1fr; }
    .detail{
      position:fixed; top:0; right:0; height:100vh; width:min(360px, 88vw);
      transform: translateX(100%); transition: transform 240ms ease; z-index:25;
      background: var(--bg);
    }
    .detail.is-open{ transform: translateX(0); }
    .detail-close{ display:flex; }
  }

  @media (max-width: 860px){
    .content{ grid-template-columns: 1fr; }
    .main-header {
      grid-column: 1;
      padding: 20px 16px 0;
    }
    .sidebar{
      grid-row: auto;
      position:fixed; top:0; left:0; height:100vh; width:min(280px, 84vw);
      transform: translateX(-100%); transition: transform 240ms ease; z-index:50;
      background: var(--bg);
    }
    .sidebar.is-open{ transform: translateX(0); }
    .filter-toggle-btn{ display:flex; }
    .main { 
      grid-row: auto;
      grid-column: 1;
      padding: 20px 16px 40px; 
    }

    /* Ipakita ang menu button */
    .mobile-menu-btn { display: flex !important; }

    /* Gawing fixed overlay drawer ang rail */
    .rail {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 240px; /* Tamang lapad para makita ang labels */
      transform: translateX(-100%); /* Nakatago sa kaliwa */
      transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 55; /* Mas mataas sa backdrop (40), kapantay halos ng sidebar filter */
      padding: 18px 14px;
    }
    
    /* Kapag naka-open ang rail sa mobile */
    .rail.is-open {
      transform: translateX(0);
    }
    
    /* Piliting ipakita ang labels kahit walang 'is-expanded' class kapag nasa mobile */
    .rail .rail-brand,
    .rail .rail-label {
      opacity: 1;
    }
    .rail .rail-btn {
      width: 100%;
    }

    /* Itago ang Expand/Collapse button sa baba dahil overlay na siya sa mobile */
    #toggleRailBtn {
      display: none;
    }
  }

  @media (max-width: 560px){
    .main-header h1{ font-size:21px; }
    .date-pill span{ display:none; }
  }

  /* ---------- Custom Scrollbars ---------- */
  
  /* I-apply ang custom scrollbar sa mga scrollable containers natin */
  .sidebar,
  .main,
  .modal-content,
  .rail {
    /* For Firefox (thin scrollbar, dark thumb, transparent track) */
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  /* For Chrome, Edge, Safari */
  .sidebar::-webkit-scrollbar,
  .main::-webkit-scrollbar,
  .modal-content::-webkit-scrollbar,
  .rail::-webkit-scrollbar {
    width: 6px;  /* Vertical scrollbar width */
    height: 6px; /* Horizontal scrollbar height (kung kailangan) */
  }

  /* Ang background (track) ng scrollbar */
  .sidebar::-webkit-scrollbar-track,
  .main::-webkit-scrollbar-track,
  .modal-content::-webkit-scrollbar-track,
  .rail::-webkit-scrollbar-track {
    background: transparent;
  }

  /* Ang slider/thumb mismo */
  .sidebar::-webkit-scrollbar-thumb,
  .main::-webkit-scrollbar-thumb,
  .modal-content::-webkit-scrollbar-thumb,
  .rail::-webkit-scrollbar-thumb {
    background-color: var(--line); /* Medyo dark brown na line color */
    border-radius: 10px;
    border: 1px solid transparent; 
    background-clip: padding-box; /* Adds a bit of padding around the thumb */
    transition: background-color var(--dur);
  }

  /* Kapag ni-hover ang scrollbar thumb */
  .sidebar::-webkit-scrollbar-thumb:hover,
  .main::-webkit-scrollbar-thumb:hover,
  .modal-content::-webkit-scrollbar-thumb:hover,
  .rail::-webkit-scrollbar-thumb:hover {
    background-color: var(--ink-muted); /* Mas liliwanag ng kaunti */

const SHAPES = {

  shortwide: { bodyY:120, bodyH:120, bodyX:14, bodyW:112, capY:66, capH:24, capX:55, capW:30, neckY:90, neckH:30, neckX:58, neckW:24 },

function bottleSVG(p){
  const s = SHAPES[p.shape];
  const labelY = s.bodyY + s.bodyH*0.36;
  const labelH = s.bodyH*0.26;
  return `<svg viewBox="0 0 140 260" role="img" aria-label="${p.name} bottle illustration">
    <polygon points="${s.bodyX},${s.bodyY} ${s.neckX},${s.neckY+s.neckH} ${s.neckX+s.neckW},${s.neckY+s.neckH} ${s.bodyX+s.bodyW},${s.bodyY}" fill="${p.glass}" />
    <rect x="${s.bodyX}" y="${s.bodyY}" width="${s.bodyW}" height="${s.bodyH}" rx="13" fill="${p.glass}" />
    <rect x="${s.neckX}" y="${s.neckY}" width="${s.neckW}" height="${s.neckH}" fill="${p.glass}" />
    <rect x="${s.capX}" y="${s.capY}" width="${s.capW}" height="${s.capH}" rx="3" fill="${p.cap}" />
    <rect x="${s.bodyX+4}" y="${s.bodyY+6}" width="6" height="${s.bodyH-12}" fill="#ffffff" opacity="0.10" />
    <rect x="${s.bodyX+9}" y="${labelY}" width="${s.bodyW-18}" height="${labelH}" rx="4" fill="#f3e9d8" opacity="0.94" />
    <text x="${s.bodyX + s.bodyW/2}" y="${labelY + labelH/2 + 5}" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="15" fill="#241a10">${p.initials}</text>
  </svg>`;
}

/* ---------------- State ---------------- */
const state = {
  tab: 'all',
  search: '',
  filters: { origin:new Set(), category:new Set(), size:new Set(), brand:new Set(), color:new Set() },
  priceFrom: 300,
  priceTo: 2600,
  page: 1,
  pageSize: 10,
  selectedId: PRODUCTS[0].id,
  collapsed: new Set(),
};

const PRICE_MIN = 300;
const PRICE_MAX = 2600;

/* ---------------- Helpers ---------------- */
function peso(n){ return '₱' + n.toLocaleString('en-PH'); }

function uniqueCounts(field){
  const map = new Map();
  PRODUCTS.forEach(p=>{
    const v = p[field];
    map.set(v, (map.get(v)||0)+1);
  });
  return [...map.entries()];
}

function getFiltered(){
  return PRODUCTS.filter(p=>{
    if(state.tab==='in' && p.stockState!=='in') return false;
    if(state.tab==='low' && p.stockState!=='low') return false;
    if(state.tab==='out' && p.stockState!=='out') return false;
    if(state.search){
      const q = state.search.toLowerCase();
      if(!p.name.toLowerCase().includes(q) && !p.brand.toLowerCase().includes(q)) return false;
    }
    if(state.filters.origin.size && !state.filters.origin.has(p.origin)) return false;
    if(state.filters.category.size && !state.filters.category.has(p.category)) return false;
    if(state.filters.size.size && !state.filters.size.has(p.sizeLabel)) return false;
    if(state.filters.brand.size && !state.filters.brand.has(p.brand)) return false;
    if(state.filters.color.size && !state.filters.color.has(p.colorName)) return false;
    if(p.price < state.priceFrom || p.price > state.priceTo) return false;
    return true;
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('is-visible');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('is-visible'), 2600);
}

/* ---------------- Sidebar ---------------- */
function renderSidebar(){
  const groups = [
    { key:'origin', label:'Origin', icon:ICONS.origin, field:'origin' },
    { key:'category', label:'Category', icon:ICONS.category, field:'category' },
    { key:'size', label:'Bottle Size', icon:ICONS.size, field:'sizeLabel' },
    { key:'brand', label:'Brand', icon:ICONS.brand, field:'brand' },
  ];

  let html = '';

  groups.forEach((g,i)=>{
    const counts = uniqueCounts(g.field);
    const collapsedCls = state.collapsed.has(g.key) ? 'is-collapsed' : '';
    html += `<div class="filter-group ${collapsedCls}" data-group="${g.key}">
      <button class="filter-group-head" data-toggle="${g.key}">
        <h3>${g.label}</h3>
        ${ICONS.chevron}
      </button>
      <div class="filter-group-body">
        ${counts.map(([val,count])=>`
          <div class="check-row">
            <span class="check-row-left">
              <input type="checkbox" id="chk-${g.key}-${val}" data-filter="${g.key}" data-value="${val}" ${state.filters[g.key].has(val)?'checked':''} />
              <label for="chk-${g.key}-${val}">${val}</label>
            </span>
            <span class="count">${count}</span>
          </div>`).join('')}
      </div>
    </div>`;
  });

  // Price range
  const fromPct = ((state.priceFrom - PRICE_MIN)/(PRICE_MAX-PRICE_MIN))*100;
  const toPct = ((state.priceTo - PRICE_MIN)/(PRICE_MAX-PRICE_MIN))*100;
  html += `<div class="filter-group ${state.collapsed.has('price')?'is-collapsed':''}" data-group="price">
    <button class="filter-group-head" data-toggle="price">
      <h3>Price Range</h3>
      ${ICONS.chevron}
    </button>
    <div class="filter-group-body">
      <div class="price-inputs">
        <div class="price-field">
          <span>From</span>
          <input type="number" id="priceFromInput" min="${PRICE_MIN}" max="${PRICE_MAX}" value="${state.priceFrom}" />
        </div>
        <span class="price-sep">–</span>
        <div class="price-field">
          <span>To</span>
          <input type="number" id="priceToInput" min="${PRICE_MIN}" max="${PRICE_MAX}" value="${state.priceTo}" />
        </div>
      </div>
      <div class="range-track">
        <div class="range-track-fill" id="priceFill" style="left:${fromPct}%; width:${Math.max(0,toPct-fromPct)}%;"></div>
        <input type="range" class="range-input" id="priceFromRange" min="${PRICE_MIN}" max="${PRICE_MAX}" step="10" value="${state.priceFrom}" aria-label="Minimum price" />
        <input type="range" class="range-input" id="priceToRange" min="${PRICE_MIN}" max="${PRICE_MAX}" step="10" value="${state.priceTo}" aria-label="Maximum price" />
      </div>
    </div>
  </div>`;

  // Colors
  const colorCounts = uniqueCounts('colorName');
  const colorHex = {};
  PRODUCTS.forEach(p=>{ colorHex[p.colorName] = p.glass; });
  html += `<div class="filter-group ${state.collapsed.has('color')?'is-collapsed':''}" data-group="color">
    <button class="filter-group-head" data-toggle="color">
      <h3>Bottle Color</h3>
      ${ICONS.chevron}
    </button>
    <div class="filter-group-body">
      <div class="swatch-row">
        ${colorCounts.map(([val])=>`<button class="swatch ${state.filters.color.has(val)?'is-active':''}" style="background:${colorHex[val]}" data-swatch="${val}" title="${val}" aria-pressed="${state.filters.color.has(val)}" aria-label="${val}"></button>`).join('')}
      </div>
    </div>
  </div>`;

  html += `<button class="clear-filters" id="clearFiltersBtn">Clear all filters</button>`;

  document.getElementById('sidebar').innerHTML = html;
}

/* ---------------- Tabs ---------------- */
function renderTabs(){
  const tabs = [
    { key:'all', label:'All' },
    { key:'in', label:'In Stock' },
    { key:'low', label:'Low Stock' },
    { key:'out', label:'Out of Stock' },
  ];
  document.getElementById('tabs').innerHTML = tabs.map(t=>
    `<button class="tab-btn ${state.tab===t.key?'is-active':''}" role="tab" aria-selected="${state.tab===t.key}" data-tab="${t.key}">${t.label}</button>`
  ).join('');
}

/* ---------------- Grid ---------------- */
function stockPillHTML(p){
  if(p.stockState==='in') return `<span class="pill pill-in">In Stock (${p.stockQty})</span>`;
  if(p.stockState==='low') return `<span class="pill pill-low">Low Stock (${p.stockQty})</span>`;
  return `<span class="pill pill-out">Out of Stock</span>`;
}
function badgeClass(b){
  if(b==='Bestseller') return 'bestseller';
  if(b==='New') return 'new';
  if(b==='Limited') return 'limited';
  return '';
}

function renderGrid(){
  const filtered = getFiltered();
  const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
  if(state.page > totalPages) state.page = totalPages;
  const start = (state.page-1) * state.pageSize;
  const pageItems = filtered.slice(start, start+state.pageSize);

  const gridEl = document.getElementById('grid');
  const metaEl = document.getElementById('gridMeta');

  if(filtered.length === 0){
    gridEl.innerHTML = `<div class="empty-state">
      <h3>No bottles match these filters</h3>
      <p>Try clearing a filter or searching a different name.</p>
      <button id="emptyClearBtn">Clear all filters</button>
    </div>`;
    metaEl.textContent = 'Showing 0 of 0 products';
  } else {
    gridEl.innerHTML = pageItems.map(p=>`
      <div class="product-card-wrap">
        <button class="product-card ${p.id===state.selectedId?'is-active':''}" data-id="${p.id}" aria-pressed="${p.id===state.selectedId}">
          ${p.badge?`<span class="badge badge-${badgeClass(p.badge)}">${p.badge}</span>`:''}
          <div class="card-art">${bottleSVG(p)}</div>
          <div class="card-body">
            <p class="card-name">${p.name}</p>
            <div class="card-meta">
              <span class="card-price">${peso(p.price)}</span>
              ${stockPillHTML(p)}
            </div>
          </div>
        </button>
        <button class="card-menu" data-menu="${p.id}" aria-label="More actions">⋮</button>
      </div>
    `).join('');
    const shownEnd = Math.min(start+state.pageSize, filtered.length);
    metaEl.textContent = `Showing ${start+1}–${shownEnd} of ${filtered.length} products`;
  }

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const pag = document.getElementById('pagination');
  if(getFiltered().length === 0){ pag.innerHTML=''; return; }
  let pages = [];
  for(let i=1;i<=totalPages;i++) pages.push(i);
  if(pages.length > 6){
    pages = [1,2,3,'…',totalPages];
  }
  pag.innerHTML = `
    <button class="page-btn" id="prevPageBtn" ${state.page===1?'disabled':''} aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    ${pages.map(p=> p==='…' ? `<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>` : `<button class="page-btn ${p===state.page?'is-active':''}" data-page="${p}">${p}</button>`).join('')}
    <button class="page-btn" id="nextPageBtn" ${state.page===totalPages?'disabled':''} aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  `;
}

/* ---------------- Events ---------------- */
function toggleDrawer(el, backdrop, open){
  el.classList.toggle('is-open', open);
  document.getElementById('backdrop').classList.toggle('is-visible', open);
}

function attachEvents(){
  // View Toggle (List/Grid)
  const viewToggleBtn = document.getElementById('viewToggleBtn');
  const gridEl = document.getElementById('grid');
  let isListView = false;

  viewToggleBtn.addEventListener('click', () => {
    isListView = !isListView;
    gridEl.classList.toggle('is-list-view', isListView);
    
    if (isListView) {
      viewToggleBtn.title = "Switch to Grid View";
      viewToggleBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>`;
    } else {
      viewToggleBtn.title = "Switch to List View";
      viewToggleBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>`;
    }
  });
  
  // Sidebar (delegated, since sidebar re-renders)
  document.getElementById('sidebar').addEventListener('click', (e)=>{
    const toggleBtn = e.target.closest('[data-toggle]');
    if(toggleBtn){
      const key = toggleBtn.dataset.toggle;
      if(state.collapsed.has(key)) state.collapsed.delete(key); else state.collapsed.add(key);
      renderSidebar();
      return;
    }
    const swatch = e.target.closest('[data-swatch]');
    if(swatch){
      const val = swatch.dataset.swatch;
      if(state.filters.color.has(val)) state.filters.color.delete(val); else state.filters.color.add(val);
      state.page = 1;
      renderSidebar();
      renderGrid();
      return;
    }
    if(e.target.id === 'clearFiltersBtn'){
      clearAllFilters();
    }
  });

  document.getElementById('sidebar').addEventListener('change', (e)=>{
    const chk = e.target.closest('[data-filter]');
    if(chk){
      const group = chk.dataset.filter;
      const val = chk.dataset.value;
      if(chk.checked) state.filters[group].add(val); else state.filters[group].delete(val);
      state.page = 1;
      renderGrid();
    }
    if(e.target.id === 'priceFromInput'){
      state.priceFrom = clampPrice(Number(e.target.value), PRICE_MIN, state.priceTo);
      state.page = 1;
      renderSidebar(); renderGrid();
    }
    if(e.target.id === 'priceToInput'){
      state.priceTo = clampPrice(Number(e.target.value), state.priceFrom, PRICE_MAX);
      state.page = 1;
      renderSidebar(); renderGrid();
    }
  });

  document.getElementById('sidebar').addEventListener('input', (e)=>{
    if(e.target.id === 'priceFromRange'){
      state.priceFrom = Math.min(Number(e.target.value), state.priceTo);
      updatePriceVisuals();
      renderGrid();
    }
    if(e.target.id === 'priceToRange'){
      state.priceTo = Math.max(Number(e.target.value), state.priceFrom);
      updatePriceVisuals();
      renderGrid();
    }
  });

  // Updates the slider fill + number fields without rebuilding the sidebar DOM,
  // so a drag in progress on the range input isn't interrupted.
  function updatePriceVisuals(){
    const fromPct = ((state.priceFrom - PRICE_MIN)/(PRICE_MAX-PRICE_MIN))*100;
    const toPct = ((state.priceTo - PRICE_MIN)/(PRICE_MAX-PRICE_MIN))*100;
    const fill = document.getElementById('priceFill');
    if(fill){ fill.style.left = fromPct+'%'; fill.style.width = Math.max(0,toPct-fromPct)+'%'; }
    const fromInput = document.getElementById('priceFromInput');
    const toInput = document.getElementById('priceToInput');
    if(fromInput) fromInput.value = state.priceFrom;
    if(toInput) toInput.value = state.priceTo;
  }

  function clampPrice(v, min, max){
    if(isNaN(v)) return min;
    return Math.max(PRICE_MIN, Math.min(PRICE_MAX, Math.max(min, Math.min(v, max))));
  }

  function clearAllFilters(){
    state.filters = { origin:new Set(), category:new Set(), size:new Set(), brand:new Set(), color:new Set() };
    state.priceFrom = PRICE_MIN;
    state.priceTo = PRICE_MAX;
    state.search = '';
    state.tab = 'all';
    state.page = 1;
    document.getElementById('searchInput').value = '';
    renderSidebar(); renderTabs(); renderGrid();
  }

  // Tabs
  document.getElementById('tabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-tab]');
    if(!btn) return;
    state.tab = btn.dataset.tab;
    state.page = 1;
    renderTabs(); renderGrid();
  });

  // Search
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    state.search = e.target.value;
    state.page = 1;
    renderGrid();
  });

  // Grid (delegated)
  document.getElementById('grid').addEventListener('click', (e)=>{
    const menuBtn = e.target.closest('[data-menu]');
    if(menuBtn){
      e.stopPropagation();
      showToast('Bottle actions aren\u2019t wired up in this demo.');
      return;
    }
    const card = e.target.closest('[data-id]');
    if(card){
      state.selectedId = card.dataset.id;
      renderGrid();
      renderDetail();
    
      // BAGONG LOGIC PARA BUKSAN ANG MODAL AT BACKDROP
      document.getElementById('detailModal').classList.add('is-open');
      document.getElementById('backdrop').classList.add('is-visible');
      return;
    }
    if(e.target.id === 'emptyClearBtn'){
      clearAllFilters();
    }
  });

  // Pagination
  document.getElementById('pagination').addEventListener('click', (e)=>{
    if(e.target.id === 'prevPageBtn'){ state.page = Math.max(1, state.page-1); renderGrid(); return; }
    if(e.target.id === 'nextPageBtn'){ state.page = state.page+1; renderGrid(); return; }
    const pbtn = e.target.closest('[data-page]');
    if(pbtn){ state.page = Number(pbtn.dataset.page); renderGrid(); }
  });

  // Detail (accordion + close + save)
  document.getElementById('detailModal').addEventListener('click', (e)=>{
    const accBtn = e.target.closest('[data-accordion]');
    if(accBtn){
      const key = accBtn.dataset.accordion;
      if(detailOpen.has(key)) detailOpen.delete(key); else detailOpen.add(key);
      renderDetail();
      return;
    }
    if(e.target.closest('#closeDetailBtn')){
      document.getElementById('detailModal').classList.remove('is-open');
      document.getElementById('backdrop').classList.remove('is-visible');
      return;
    }
    if(e.target.closest('#saveChangesBtn')){
      showToast('Changes saved (demo only).');
      // Pwede mong isara rin ang modal kapag nag-save:
      document.getElementById('detailModal').classList.remove('is-open');
      document.getElementById('backdrop').classList.remove('is-visible');
    }
  });

  // Header actions
  document.getElementById('refreshBtn').addEventListener('click', (e)=>{
    e.currentTarget.classList.remove('is-spinning');
    void e.currentTarget.offsetWidth;
    e.currentTarget.classList.add('is-spinning');
    showToast('Inventory refreshed.');
  });
  document.getElementById('addBottleBtn').addEventListener('click', ()=>{
    showToast('Demo only \u2014 connect this to your inventory system to add bottles.');
  });

  // Mobile drawers
  document.getElementById('openSidebarBtn').addEventListener('click', () => {
    // I-check kung mobile screen (860px pababa)
    const isMobile = window.matchMedia('(max-width: 860px)').matches;
    const sidebar = document.getElementById('sidebar');

    if (isMobile) {
      // Logic para sa Mobile: I-toggle bilang Drawer/Overlay
      const isOpen = sidebar.classList.contains('is-open');
      toggleDrawer(sidebar, null, !isOpen);
    } else {
      // Logic para sa Desktop: I-toggle ang pag-collapse ng sidebar column
      const content = document.querySelector('.content');
      content.classList.toggle('sidebar-collapsed');
    }
  });
  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('rail').classList.add('is-open');
    document.getElementById('backdrop').classList.add('is-visible');
  });
  document.getElementById('backdrop').addEventListener('click', () => {
    // Isasara ang lahat ng drawers at modals kapag pinindot ang background
    document.getElementById('sidebar').classList.remove('is-open'); // Filter Drawer
    document.getElementById('detailModal').classList.remove('is-open'); // Product Modal
    document.getElementById('rail').classList.remove('is-open'); // Main Rail Drawer
    document.getElementById('backdrop').classList.remove('is-visible');
  });

  // Expand/Collapse Rail Bar
  document.getElementById('toggleRailBtn').addEventListener('click', () => {
    const rail = document.getElementById('rail');
    rail.classList.toggle('is-expanded');
    
    // Palitan ang title tooltip at text label ng arrow button
    const btn = document.getElementById('toggleRailBtn');
    const label = btn.querySelector('.rail-label');
    
    if(rail.classList.contains('is-expanded')){
      btn.title = "Collapse menu";
      label.textContent = "Collapse";
    } else {
      btn.title = "Expand menu";
      label.textContent = "Expand";
    }
  });
}

/* ---------------- Init ---------------- */
function init(){
  renderSidebar();
  renderTabs();
  renderGrid();
  renderDetail();
  attachEvents();
}

init();

</script>
</body>
</html>
